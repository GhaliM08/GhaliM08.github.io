<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تواصل معي | غالي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header container">
    <p class="site-name"><a href="index.html">غالي</a></p>
    <nav aria-label="القائمة الرئيسية">
      <ul class="nav-list">
        <li><a href="index.html">عنّي</a></li>
        <li><a href="projects.html">مشاريعي</a></li>
        <li><a href="contact.html">تواصل معي</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h1>تواصل معي</h1>

    <form method="get">
      <p>
        <label for="name">الاسم</label>
        <input type="text" id="name" name="name" required>
      </p>
      <p>
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" name="email" required>
      </p>
      <p>
        <label for="reason">سبب التواصل</label>
        <select id="reason" name="reason">
          <option value="question">استفسار</option>
          <option value="suggestion">اقتراح</option>
          <option value="collaboration">تعاون</option>
        </select>
      </p>
      <p>
        <label for="message">رسالتك</label>
        <textarea id="message" name="message" rows="4" minlength="20"></textarea>
      </p>
      <button type="submit">إرسال</button>
    </form>
  </main>

  <footer class="site-footer container">
    <p>© غالي</p>
  </footer>
</body>
</html>
