<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تواصل معي | غالي</title>
</head>
<body>
  <header>
    <p><a href="index.html">غالي</a></p>
    <nav>
      <a href="index.html">عنّي</a> |
      <a href="projects.html">مشاريعي</a> |
      <a href="contact.html">تواصل معي</a>
    </nav>
  </header>

  <main>
    <h1>تواصل معي</h1>

    <form method="get">
      <p>
        <label for="name">الاسم</label>
        <input type="text" id="name" name="name" required>
      </p>
      <p>
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" name="email" required>
      </p>
      <p>
        <label for="reason">سبب التواصل</label>
        <select id="reason" name="reason">
          <option value="question">استفسار</option>
          <option value="suggestion">اقتراح</option>
          <option value="collaboration">تعاون</option>
        </select>
      </p>
      <p>
        <label for="message">رسالتك</label>
        <textarea id="message" name="message" rows="4" minlength="20"></textarea>
      </p>
      <button type="submit">إرسال</button>
    </form>
  </main>

  <footer>
    <p>© غالي</p>
  </footer>
</body>
</html>
